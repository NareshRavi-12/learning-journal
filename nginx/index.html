<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Journal - Udemy Style Courses</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f7f9fa;
            color: #1c1d1f;
        }

        /* Header */
        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #142817;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-container {
            flex: 1;
            max-width: 400px;
        }

        .search-bar {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #ccc;
            border-radius: 24px;
            font-size: 14px;
            background-color: #f7f9fa;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            outline: none;
            border-color: #1c1d1f;
            background-color: white;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #1c1d1f;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #a435f0;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 48px 24px;
            text-align: center;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 24px;
            opacity: 0.95;
        }

        /* Categories */
        .categories-section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .categories-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .categories {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 12px;
        }

        .category-btn {
            padding: 8px 24px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 24px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .category-btn:hover,
        .category-btn.active {
            background: #1c1d1f;
            color: white;
            border-color: #1c1d1f;
        }

        /* Courses Grid */
        .courses-section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        /* Course Card */
        .course-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #e5e7eb;
        }

        .course-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            transform: translateY(-4px);
        }

        .course-image {
            width: 100%;
            height: 135px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .course-image.bestseller::after {
            content: 'BESTSELLER';
            position: absolute;
            top: 8px;
            left: 8px;
            background: #eccc49;
            color: #1c1d1f;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 700;
        }

        .course-content {
            padding: 12px 12px;
        }

        .course-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.4;
            color: #1c1d1f;
        }

        .course-instructor {
            font-size: 12px;
            color: #6a6f73;
            margin-bottom: 8px;
        }

        .course-rating {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .stars {
            color: #eccc49;
            display: flex;
            gap: 2px;
        }

        .rating-text {
            color: #6a6f73;
        }

        .reviews-count {
            color: #6a6f73;
            font-size: 12px;
        }

        .course-price {
            font-size: 14px;
            font-weight: 700;
            color: #1c1d1f;
        }

        .original-price {
            text-decoration: line-through;
            color: #6a6f73;
            font-weight: 400;
            font-size: 12px;
            margin-left: 8px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-wrap: wrap;
            }

            .search-container {
                max-width: 100%;
                order: 3;
                width: 100%;
            }

            .nav-links {
                gap: 15px;
                font-size: 12px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .courses-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-book"></i>
                Learning Journal
            </div>
            <div class="search-container">
                <input type="text" class="search-bar" placeholder="Search courses...">
            </div>
            <ul class="nav-links">
                <li><a href="#">Teach on LJ</a></li>
                <li><a href="#"><i class="fas fa-bell"></i></a></li>
                <li><a href="#"><i class="fas fa-shopping-cart"></i></a></li>
                <li><a href="#"><i class="fas fa-user-circle"></i></a></li>
            </ul>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Learn New Skills Online</h1>
            <p>Expand your career with courses taught by industry experts. Start your learning journey today.</p>
        </div>
    </section>

    <!-- Categories -->
    <section class="categories-section">
        <div class="categories-title">Top Categories</div>
        <div class="categories">
            <button class="category-btn active">All Courses</button>
            <button class="category-btn">Web Development</button>
            <button class="category-btn">Mobile App Dev</button>
            <button class="category-btn">Data Science</button>
            <button class="category-btn">Machine Learning</button>
            <button class="category-btn">UI/UX Design</button>
            <button class="category-btn">Cloud Computing</button>
            <button class="category-btn">DevOps</button>
        </div>
    </section>

    <!-- Courses Grid -->
    <section class="courses-section">
        <div class="section-title">Featured Courses</div>
        <div class="courses-grid" id="coursesGrid">
            <!-- Courses will be populated by JavaScript -->
        </div>
    </section>

    <script>
        const courses = [
            {
                id: 1,
                icon: '🌐',
                title: 'The Complete Web Development Bootcamp 2024',
                instructor: 'Angela Yu',
                rating: 4.8,
                reviews: 1250000,
                price: '$14.99',
                originalPrice: '$79.99',
                bestseller: true
            },
            {
                id: 2,
                icon: '⚛️',
                title: 'React - The Complete Guide',
                instructor: 'Maximilian Schwarzmüller',
                rating: 4.7,
                reviews: 850000,
                price: '$14.99',
                originalPrice: '$79.99',
                bestseller: true
            },
            {
                id: 3,
                icon: '🐍',
                title: 'Complete Python Bootcamp',
                instructor: 'Jose Portilla',
                rating: 4.6,
                reviews: 920000,
                price: '$12.99',
                originalPrice: '$79.99',
                bestseller: false
            },
            {
                id: 4,
                icon: '🎨',
                title: 'UI/UX Design Fundamentals',
                instructor: 'David Lanham',
                rating: 4.7,
                reviews: 320000,
                price: '$14.99',
                originalPrice: '$69.99',
                bestseller: true
            },
            {
                id: 5,
                icon: '☁️',
                title: 'AWS Certified Solutions Architect',
                instructor: 'Stephane Maarek',
                rating: 4.8,
                reviews: 450000,
                price: '$14.99',
                originalPrice: '$79.99',
                bestseller: true
            },
            {
                id: 6,
                icon: '🤖',
                title: 'Machine Learning by Andrew Ng',
                instructor: 'Andrew Ng',
                rating: 4.9,
                reviews: 680000,
                price: '$9.99',
                originalPrice: '$89.99',
                bestseller: true
            },
            {
                id: 7,
                icon: '📱',
                title: 'Flutter & Dart Bootcamp',
                instructor: 'Mark Serrels',
                rating: 4.6,
                reviews: 210000,
                price: '$14.99',
                originalPrice: '$99.99',
                bestseller: false
            },
            {
                id: 8,
                icon: '🗄️',
                title: 'SQL & Database Design Masterclass',
                instructor: 'Tim Buchalka',
                rating: 4.7,
                reviews: 380000,
                price: '$11.99',
                originalPrice: '$79.99',
                bestseller: false
            }
        ];

        function renderCourses(coursesToRender = courses) {
            const grid = document.getElementById('coursesGrid');
            grid.innerHTML = coursesToRender.map(course => `
                <div class="course-card">
                    <div class="course-image ${course.bestseller ? 'bestseller' : ''}">
                        ${course.icon}
                    </div>
                    <div class="course-content">
                        <div class="course-title">${course.title}</div>
                        <div class="course-instructor">${course.instructor}</div>
                        <div class="course-rating">
                            <span class="rating-text">${course.rating}</span>
                            <div class="stars">
                                ${'⭐'.repeat(Math.floor(course.rating))}
                            </div>
                            <span class="reviews-count">(${(course.reviews / 1000).toFixed(0)}K)</span>
                        </div>
                        <div class="course-price">
                            ${course.price}
                            <span class="original-price">${course.originalPrice}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Initial render
        renderCourses();

        // Search functionality
        document.querySelector('.search-bar').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = courses.filter(course => 
                course.title.toLowerCase().includes(searchTerm) ||
                course.instructor.toLowerCase().includes(searchTerm)
            );
            renderCourses(filtered);
        });

        // Category filter
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                // In a real app, this would filter courses by category
            });
        });

        // Course card click handler
        document.addEventListener('click', function(e) {
            if (e.target.closest('.course-card')) {
                alert('Course details page coming soon!');
            }
        });
    </script>
</body>
</html>
